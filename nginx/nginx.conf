# Actividad 3 - NGINX como punto unico de entrada REST (puerto 8090)
# Uso (desde C:\nginx):  nginx.exe -t -c "<ruta>\nginx\nginx.conf" -p C:/nginx/
#                        nginx.exe    -c "<ruta>\nginx\nginx.conf" -p C:/nginx/
# Puertos usados (8080-8084 estan ocupados en este equipo):
#   Java A 8086 | Java B 8087 | FastAPI 8000 | Notificaciones 8088 | Monitor 8083 (externo)
worker_processes  1;
events { worker_connections 1024; }

http {
    # Registro con la instancia real que atendio cada peticion (para contar A/B)
    log_format clase '$time_iso8601 $remote_addr "$request" status=$status backend=$upstream_addr rt=$request_time';
    access_log logs/access.log clase;

    # Balanceo ponderado 3:1 + tolerancia a fallos
    upstream vehiculos_backend {
        server 127.0.0.1:8086 weight=3 max_fails=1 fail_timeout=10s;   # instancia A
        server 127.0.0.1:8087 weight=1 max_fails=1 fail_timeout=10s;   # instancia B
    }
    # Servicios que NO se balancean: un solo destino cada uno
    upstream ventas_backend         { server 127.0.0.1:8000; }
    upstream notificaciones_backend { server 127.0.0.1:8088; }

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 127.0.0.1:8090;
        server_name localhost;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Idempotency-Key   $http_idempotency_key;
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;

        # Responde NGINX mismo, sin tocar ningun backend
        location = /nginx-ping {
            access_log off;
            default_type text/plain;
            return 200 "pong\n";
        }

        # Autenticacion y vehiculos -> upstream balanceado
        location = /oauth/token {
            proxy_pass http://vehiculos_backend;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
        location /api/vehiculos {
            proxy_pass http://vehiculos_backend;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }
        location = /api/identidad {
            proxy_pass http://vehiculos_backend;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # Salud de la instancia que NGINX elija
        location = /actuator/health {
            proxy_pass http://vehiculos_backend;
            proxy_next_upstream error timeout http_502 http_503;
        }

        # Salud directa por instancia (para comprobar A y B por separado)
        location = /health/a { proxy_pass http://127.0.0.1:8086/actuator/health; }
        location = /health/b { proxy_pass http://127.0.0.1:8087/actuator/health; }

        # FastAPI: compradores y ventas (sin balanceo de vehiculos)
        location /api/compradores { proxy_pass http://ventas_backend; }
        location /api/ventas      { proxy_pass http://ventas_backend; }

        # Notificaciones (incluye /stream SSE: sin buffering)
        location /api/notificaciones {
            proxy_pass http://notificaciones_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }
}
