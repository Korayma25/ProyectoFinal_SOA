spring.application.name=monitor-balancer-service
server.port=${MONITOR_PORT:8095}

# Destinos a supervisar (se pueden cambiar con variables de entorno)
monitor.nginx-url=${MONITOR_NGINX_URL:http://127.0.0.1:8090/nginx-ping}
monitor.instancia-a=${MONITOR_INSTANCIA_A:http://127.0.0.1:8086/actuator/health}
monitor.instancia-b=${MONITOR_INSTANCIA_B:http://127.0.0.1:8087/actuator/health}
monitor.access-log=${MONITOR_ACCESS_LOG:C:/nginx/logs/access.log}
monitor.intervalo-ms=${MONITOR_INTERVALO_MS:5000}
monitor.timeout-ms=${MONITOR_TIMEOUT_MS:2000}
monitor.max-lineas-log=${MONITOR_MAX_LINEAS_LOG:5000}
