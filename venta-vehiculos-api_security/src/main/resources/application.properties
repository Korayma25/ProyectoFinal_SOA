# API de vehículos: solamente el equipo local.
# Instancia A = 8086 (por defecto). Instancia B: variable de entorno SERVER_PORT=8087.
server.port=8086
server.address=127.0.0.1

# MySQL/MariaDB ya existente en XAMPP (NO crear otra base).
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/vehiculos?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Verificar la estructura, sin crear ni modificar tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Secretos: NO se guardan en el repositorio. Se leen de variables de entorno o del archivo local
# secrets.local.properties (excluido de Git; plantilla en secrets.local.properties.example).
spring.config.import=optional:file:./secrets.local.properties

# Autenticación JWT y cliente.
app.security.jwt-secret=${APP_JWT_SECRET:cambiar-esto}
app.security.access-token-minutes=30
app.security.refresh-token-minutes=1440
app.security.client-id=${APP_CLIENT_ID:vehiculos-client}
app.security.client-secret=${APP_CLIENT_SECRET:cambiar-esto}

# DEBE coincidir con SERVICE_KEY en Python (longitud >= 32).
app.security.ventas-key=${APP_VENTAS_KEY:cambiar-esto}

# Notificaciones Java: comparte la MISMA clave con Python.
servicios.notificaciones.url=http://127.0.0.1:8088
servicios.notificaciones.key=${NOTIFICACIONES_KEY:cambiar-esto}
servicios.notificaciones.destinatario=pruebas@ejemplo.com

# SOLO si necesitas crear un usuario de prueba: activar temporalmente
# spring.profiles.active=local
app.bootstrap.user=${BOOTSTRAP_USER:usuario_admin}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:cambiar-esto}
app.bootstrap.role=ADMIN

# Actividad 3: solo se expone la salud (sin detalles) para NGINX y el monitor.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
