# Conexión a RabbitMQ (Actividad 9). Se pueden sobrescribir con variables de entorno.
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Confirmación manual del procesamiento: si falla, el mensaje no se pierde.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Si RabbitMQ aún no está activo al iniciar, el servicio arranca igual y el listener se reconecta solo.
spring.rabbitmq.listener.simple.missing-queues-fatal=false
app.rabbit.cola-ventas=notificaciones.ventas
