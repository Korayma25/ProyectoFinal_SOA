# Base de datos del servicio de notificaciones (Actividad 9): tabla notificaciones dentro de la base vehiculos. Se pueden sobrescribir con variables de entorno.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:vehiculos}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Si MySQL no está disponible al iniciar, el servicio arranca igual; los mensajes quedan en RabbitMQ.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
